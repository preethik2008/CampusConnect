{% extends "base.html" %}
{% block title %}Create Account | CampusConnect{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card auth-card-wide glass">
        <div class="auth-logo"><span class="brand-icon"><svg viewBox="0 0 40 40" width="26" height="26"><circle cx="22" cy="21" r="10" fill="#fff"/><circle cx="10" cy="9" r="4.5" fill="#fff" opacity=".85"/><circle cx="33" cy="9" r="4.5" fill="#fff" opacity=".85"/><circle cx="8" cy="29" r="6" fill="#fff" opacity=".9"/><circle cx="33" cy="30" r="4.5" fill="#fff" opacity=".85"/></svg></span></div>
        <h1>Create Account</h1>
        <p class="auth-subtitle">Join CampusConnect today</p>
        <form method="POST" action="{{ url_for('signup') }}">
            <div class="form-group"><label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required></div>
            <div class="form-group"><label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required></div>
            <div class="form-row">
                <div class="form-group"><label for="role">Account Type</label>
                    <select id="role" name="role"><option value="student">Student</option><option value="organizer">Organizer</option></select></div>
                <div class="form-group"><label for="department">Department</label>
                    <input type="text" id="department" name="department" value="IT"></div>
            </div>
            <div class="form-group"><label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required></div>
            <button type="submit" class="btn btn-primary full-width">Create Account</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</section>
{% endblock %}
