{% extends "base.html" %}
{% block title %}Error | CampusConnect{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="error-card glass">
        <div class="error-code">{{ error_code }}</div>
        <h1>Oops!</h1>
        <p>{{ error_message }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary mt">Back to Home</a>
    </div>
</section>
{% endblock %}
